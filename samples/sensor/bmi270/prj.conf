CONFIG_STDOUT_CONSOLE=y
CONFIG_SPI=y
CONFIG_SENSOR=y

# Needed for the step-counter interrupt (INT1, driven off the on-chip
# feature engine) demonstrated in main.c.
CONFIG_BMI270_TRIGGER_GLOBAL_THREAD=y

# Temporary: surface the driver's LOG_DBG() feature-register writes
# (bmi270_feature_reg_write logs every page/addr/value it writes) so we can
# confirm the step-counter enable + watermark writes actually happen.
CONFIG_SENSOR_LOG_LEVEL_DBG=y

CONFIG_USE_SEGGER_RTT=y
CONFIG_CONSOLE=y
CONFIG_RTT_CONSOLE=y
CONFIG_UART_CONSOLE=n
CONFIG_LOG_BACKEND_RTT=y

# LOG_MODE_MINIMAL (the previous setting) is a thin printk() wrapper with
# no timestamps, prefixes, or colors by design. Use synchronous mode
# instead so log lines get a "[hh:mm:ss.mmm,uuu]" timestamp prefix. Log
# calls block until the RTT backend accepts them (fine for this sample's
# log volume); switch to LOG_MODE_DEFERRED instead if that ever becomes a
# problem.
CONFIG_LOG_MODE_IMMEDIATE=y

CONFIG_SEGGER_RTT_BUFFER_SIZE_UP=4096
CONFIG_LOG=y