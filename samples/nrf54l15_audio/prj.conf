CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_AUDIO=y
CONFIG_BT_BAP_UNICAST_SERVER=y
CONFIG_BT_ASCS=y
CONFIG_BT_ASCS_ASE_SNK_COUNT=1
CONFIG_BT_ASCS_ASE_SRC_COUNT=1
CONFIG_BT_ISO_TX_BUF_COUNT=8
# Support an ISO channel per ASE
CONFIG_BT_ISO_PERIPHERAL=y

CONFIG_BT_ISO_MAX_CHAN=2
CONFIG_NRFX_I2S20=y
CONFIG_DATA_FIFO=y
CONFIG_PCM_MIX=y
CONFIG_CONTIN_ARRAY=y
CONFIG_LOG=y
CONFIG_THREAD_NAME=y

CONFIG_FPU=y
CONFIG_NEWLIB_LIBC=y
CONFIG_CMSIS_DSP=y
CONFIG_SW_CODEC_LC3_T2_SOFTWARE=y
CONFIG_BT_BONDABLE=n

# Mandatory to support at least 1 for ASCS
CONFIG_BT_CTLR_ISO_TX_BUFFERS=2
CONFIG_BT_CTLR_ISO_TX_BUFFER_SIZE=155

CONFIG_BT_EXT_ADV=y
CONFIG_BT_ATT_PREPARE_COUNT=8
CONFIG_BT_DEVICE_NAME="nRF54L15_mic"
CONFIG_BT_BAP_UNICAST_SERVER_LOG_LEVEL_DBG=y
CONFIG_BT_AUDIO_CODEC_CFG_MAX_METADATA_SIZE=80
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_BT_RX_STACK_SIZE=4096
CONFIG_LOG_BUFFER_SIZE=12000
CONFIG_BT_ISO_LOG_LEVEL_DBG=y
#CONFIG_BT_BAP_STREAM_LOG_LEVEL_DBG=y
#CONFIG_BT_LOG_SNIFFER_INFO=y
CONFIG_NRFX_DPPI=y
CONFIG_PSCM=y
CONFIG_LOG_BUFFER_SIZE=12000
CONFIG_BT_LOG_SNIFFER_INFO=y
CONFIG_SAMPLE_RATE_CONVERTER_FILTER_SIMPLE=y
CONFIG_SAMPLE_RATE_CONVERTER=y
CONFIG_SAMPLE_RATE_CONVERTER_BIT_DEPTH_32=y